[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ideapress"
description = "Turns an idea into finished content through configurable, Python-controlled workflows in which models perform bounded, validated tasks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# sweatmeter is an optional extra ([telemetry]) for status display only, never a hard dependency.
dependencies = [
    "baseaicore>=0.4,<0.5",
    "setspec>=0.4,<0.5",
    "modelrack>=0.5,<0.6",
    "weightsdb>=0.2,<0.3",
    "mirrorwall>=0.2,<0.3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "typer>=0.12,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
telemetry = [
    "sweatmeter>=0.4,<0.5",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "respx>=0.21,<1",
    "loadcoach  # test-only: OpenAPI snapshot for contract tests, never imported under src/",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/JPKell/IdeaPress"
Documentation = "https://github.com/JPKell/IdeaPress/tree/main/docs"
Changelog = "https://github.com/JPKell/IdeaPress/blob/main/CHANGELOG.md"

[project.scripts]
ideapress = "ideapress.cli.main:app"

[tool.hatch.version]
path = "src/ideapress/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ideapress"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ideapress"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
