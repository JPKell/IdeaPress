[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ideapress"
description = "Turns an idea into finished content through configurable, Python-controlled workflows in which models perform bounded, validated tasks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# sweatmeter is an optional extra ([telemetry]) for status display only, never a hard dependency.
dependencies = [
    "baseaicore>=0.4,<0.5",
    "setspec>=0.4,<0.5",
    "modelrack>=0.5,<0.6",
    "weightsdb>=0.2,<0.3",
    "mirrorwall>=0.2,<0.3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "typer>=0.12,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
telemetry = [
    "sweatmeter>=0.4,<0.5",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "respx>=0.21,<1",
]
# P7's LoadCoach-adapter contract tests read LoadCoach's OpenAPI snapshot, so they need the
# package installed — but it is deliberately NOT in `dev`. Gold Standards §2's first IdeaPress
# bullet is "runs a complete workflow with no LoadCoach and no FreeWeight installed", and risk I2
# names "the standalone e2e suite is the default CI path" as its mitigation. A `dev` extra that
# pulls in `loadcoach` would put the package in every developer and CI environment, so the
# property would be claimed by a suite that never runs without it. Install
# `.[dev,loadcoach-contract]` for that one job; never imported under `src/` either way, which
# `.importlinter`'s `no-other-applications` contract enforces independently.
loadcoach-contract = [
    "loadcoach",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/JPKell/IdeaPress"
Documentation = "https://github.com/JPKell/IdeaPress/tree/main/docs"
Changelog = "https://github.com/JPKell/IdeaPress/blob/main/CHANGELOG.md"

[project.scripts]
ideapress = "ideapress.cli.main:app"

[tool.hatch.version]
path = "src/ideapress/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ideapress"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# `docs/` is a byte-identical mirror of `~/ai/suite/docs`, and ruff formats fenced Python inside
# Markdown. Without this, `ruff format` rewrites the aligned `LOADCOACH_TASK_MAP` literal in
# `workflows.md` and the mirror silently diverges from canonical — mechanising exactly the
# downstream-first drift that corrupted eight repos' mirrors (SUITE_REVIEW F-3). Workspace
# CLAUDE.md states this exclusion as the rule; ModelRack already carries it.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]
# Alembic-generated: upgrade()/downgrade() carry no behaviour beyond the revision's own
# docstring, and their bodies are op.* DDL calls Alembic itself generated.
"src/ideapress/infrastructure/db/migrations/versions/*.py" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
# Test modules import shared fixtures as `tests.…`. Under the default `prepend` import mode pytest
# puts the *test file's* directory on sys.path, not the repository root, so `import tests` resolves
# only when the runner happens to insert the cwd — `python -m pytest` does, the bare `pytest`
# console script does not, and CI runs the bare one. Stating the root here makes both agree.
pythonpath = ["."]
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
]
testpaths = ["tests"]

[tool.coverage.run]
# The **importable package**, not the source path. A path-based source measures nothing against a
# non-editable install (`pip install dist/*.whl`): every test passes and the gate reports 0 % — a
# number that looks like a catastrophe instead of a configuration error (M6-17).
source = ["ideapress"]
branch = true

[tool.coverage.paths]
# Maps the installed package back onto the checkout, so a report produced against site-packages
# names files a reader can open.
source = ["src/ideapress", "*/site-packages/ideapress"]

[tool.coverage.report]
fail_under = 85
show_missing = true
